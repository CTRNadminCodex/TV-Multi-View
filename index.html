<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#07101a">
<title>MY GREEK TV | Multi-View v3 · 11 channels</title>
<style>
:root{color-scheme:dark;--bg:#07101a;--panel:#0c1927;--fg:#edf8ff;--sub:#abc0d0;--mint:#7ce5bc;--border:#294253}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;min-height:55px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;min-width:0}
h1{font-size:clamp(16px,2vw,22px);letter-spacing:-.02em;line-height:1;margin:0}
.live{font-size:10px;color:var(--mint);font-weight:800;letter-spacing:.11em;display:flex;gap:5px;align-items:center}
.live:before{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--mint)}
.actions{display:flex;align-items:center;gap:6px}
button{font:inherit;font-size:12px;font-weight:800;white-space:nowrap;border:1px solid #4b6575;border-radius:8px;min-height:37px;padding:7px 11px;background:#1b3040;color:#fff;cursor:pointer}
button.primary{background:var(--mint);border-color:var(--mint);color:#062d24}
button:focus-visible,.watch:focus-visible,.audio-slider:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));flex:1;min-height:0;gap:6px;padding:0 10px 10px}
.tile{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tilehead{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:35px;padding:3px 7px;background:#112738;flex-shrink:0}
.chname{font-size:clamp(10px,1.1vw,14px);font-weight:800;letter-spacing:.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soundcontrol{display:flex;align-items:center;gap:5px;flex-shrink:0;min-height:28px;cursor:default}
.speaker{width:17px;text-align:center;font-size:14px;line-height:1;user-select:none}
.audio-slider{display:block;-webkit-appearance:none;appearance:none;width:68px;height:25px;margin:0;border:1px solid #4b677a;border-radius:30px;background:#304759;cursor:ew-resize;outline:none;touch-action:none;user-select:none;-webkit-user-select:none;padding:0 3px;transition:background .13s}
.audio-slider.on{background:#2b9e77;border-color:#6ae5b2}
.audio-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:19px;height:19px;background:#fff;border-radius:50%;border:1px solid #e1edf2;box-shadow:0 1px 3px #0007}
.audio-slider::-moz-range-thumb{width:22px;height:22px;background:#fff;border:1px solid #e1edf2;border-radius:50%}
.audio-slider::-moz-range-track{background:transparent;border:0}
.watch{position:relative;display:block;flex:1;min-height:0;background:black;cursor:pointer;overflow:hidden;touch-action:manipulation}
.watch video{width:100%;height:100%;display:block;object-fit:contain;background:#000;pointer-events:none}
.watch .feedback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#d8e7f2;pointer-events:none;text-shadow:0 1px 4px #000;background:transparent}
.watch .feedback:empty{display:none}
.watch .feedback.error{color:#ffba8b;font-size:15px;font-weight:700}
.tile.empty .tilehead{background:#101b28}
.tile.empty .watch{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0e1b2a,#172739);cursor:default}
.emptymark{font-size:34px;font-weight:200;color:#527084}
.focus{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;align-items:stretch}
.focus.show{display:flex}
.focushead{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:linear-gradient(#000e,#0000);pointer-events:none}
.focushead button{pointer-events:auto}
.focushead strong{font-size:clamp(15px,2vw,20px);text-shadow:0 1px 3px #000}
.focus video{height:100%;width:100%;object-fit:contain}
@media(max-width:650px) and (orientation:portrait){body{height:auto;min-height:100dvh;overflow:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;flex:none}.watch{aspect-ratio:16/9;flex:none}.audio-slider{width:59px}.tilehead{padding:4px}.chname{font-size:10px}}
@media(max-height:450px) and (orientation:landscape){header{min-height:43px;padding:4px 10px}.tilehead{min-height:29px}.audio-slider{width:54px;height:25px}.audio-slider::-webkit-slider-thumb{width:19px;height:19px}.grid{gap:5px;padding:0 8px 8px}button{min-height:31px;padding:5px 8px}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>MY GREEK TV</h1><span class="live">V3 LIVE</span></div>
  <div class="actions"><button id="two" type="button">2 LIVE</button><button id="six" type="button">6 LIVE</button><button id="all" class="primary" type="button">11 LIVE</button><button id="stop" type="button" aria-label="Σταμάτημα όλων">■ STOP</button></div>
</header>
<main class="grid" id="grid" aria-label="Πολλαπλή προβολή καναλιών"></main>
<div class="focus" id="focus" aria-hidden="true">
 <div class="focushead"><button type="button" id="back">← ΠΙΣΩ</button><strong id="focusName"></strong></div>
 <video id="focusVideo" playsinline webkit-playsinline preload="none" controls></video>
</div>
<script>
'use strict';
// Version 3: six original channels and five newly added Greek live channels.
// Stream sources are public listings and can change without warning.
const channels=[
 {id:'skai',name:'ΣΚΑΪ',url:'https://skai-live.siliconweb.com/media/cambria4/index.m3u8',format:'hls'},
 {id:'action',name:'ACTION 24',url:'https://actionlive.siliconweb.com/actionabr/actiontv/playlist.m3u8',format:'hls'},
 {id:'naft',name:'ΝΑΥΤΕΜΠΟΡΙΚΗ',url:'https://telmaco.ascdn.broadpeak.io/nafteboriki/default/index.m3u8',format:'hls'},
 {id:'ert',name:'ERT NEWS',url:'https://ert-ucdn.broadpeak-aas.com/bpk-tv/ERTNews/default/index.mpd',format:'dash'},
 {id:'open',name:'OPEN',url:'https://liveopen.siliconweb.com/openTvLive/liveopen/playlist.m3u8',format:'hls'},
 {id:'one',name:'ONE CHANNEL',url:'https://onechannel.siliconweb.com/one/stream/chunks_dvr.m3u8',format:'hls'},
 {id:'alpha',name:'ALPHA',url:'https://alphatvlive2.siliconweb.com/alphatvlive/live_abr/playlist.m3u8',format:'hls'},
 {id:'star',name:'STAR',url:'https://livestar.siliconweb.com/starvod/star4/star4.m3u8',format:'hls'},
 {id:'meganews',name:'MEGA NEWS',url:'https://c98db5952cb54b358365984178fb898a.msvdn.net/live/S99841657/NU0xOarAMJ5X/playlist.m3u8',format:'hls'},
 {id:'bluesky',name:'BLUE SKY',url:'https://cdn5.smart-tv-data.com/bluesky/bluesky-live/playlist.m3u8',format:'hls'},
 {id:'ant1',name:'ANT1',url:'https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8',format:'hls'}
];
const slots=['skai','action','naft','ert','open','one','alpha','star','meganews','bluesky','ant1',null];
const totalSlots=12;
const videos=[],sliders=[],speakers=[],feedbacks=[],dashSessions=Array(totalSlots).fill(null),hlsSessions=Array(totalSlots).fill(null);
const loaded=new Set(),grid=document.getElementById('grid'),focus=document.getElementById('focus'),focusVideo=document.getElementById('focusVideo');
const channelFor=i=>channels.find(c=>c.id===slots[i]);
let playingCount=0,audible=-1,focusIndex=-1,focusDash=null,focusHls=null,session=0,focusToken=0;
for(let i=0;i<totalSlots;i++){
 const c=channelFor(i),tile=document.createElement('section');tile.className='tile'+(!c?' empty':'');
 const bar=document.createElement('div');bar.className='tilehead';
 const name=document.createElement('span');name.className='chname';name.textContent=c?c.name:'—';
 bar.append(name);
 const video=document.createElement('video');video.muted=true;video.defaultMuted=true;video.autoplay=true;video.playsInline=true;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.preload='none';
 const watch=document.createElement('div');watch.className='watch';
 const feedback=document.createElement('div');feedback.className='feedback';
 if(c){
  const control=document.createElement('label');control.className='soundcontrol';control.title='Σύρε δεξιά για ήχο, αριστερά για σίγαση';
  const speaker=document.createElement('span');speaker.className='speaker';speaker.textContent='🔇';speaker.setAttribute('aria-hidden','true');
  const slider=document.createElement('input');slider.className='audio-slider';slider.type='range';slider.min='0';slider.max='100';slider.step='1';slider.value='0';slider.setAttribute('aria-label','Ήχος '+c.name+' (σύρε δεξιά για ενεργοποίηση)');
  control.append(speaker,slider);bar.append(control);sliders[i]=slider;speakers[i]=speaker;
  for(const event of ['click','dblclick','pointerdown','pointerup','touchstart','touchend','mousedown'])control.addEventListener(event,e=>e.stopPropagation());
  slider.addEventListener('input',()=>{if(Number(slider.value)>=65 && audible!==i)selectAudio(i,true);else if(Number(slider.value)<=35 && audible===i)selectAudio(i,false)});
  slider.addEventListener('change',()=>selectAudio(i,Number(slider.value)>=50));
  watch.tabIndex=0;watch.setAttribute('role','button');watch.setAttribute('aria-label','Πλήρης προβολή '+c.name);
  watch.append(video,feedback);
  watch.addEventListener('click',()=>openFocus(i));
  watch.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openFocus(i)}});
  video.addEventListener('playing',()=>{feedback.textContent='';feedback.classList.remove('error')});
  video.addEventListener('error',()=>{feedback.textContent='⚠';feedback.classList.add('error')});
 }else{
  sliders[i]=null;speakers[i]=null;
  const empty=document.createElement('span');empty.className='emptymark';empty.textContent='+';watch.append(empty);
 }
 tile.append(bar,watch);grid.append(tile);videos[i]=video;feedbacks[i]=feedback;
}
function paintAudio(){
 for(let i=0;i<totalSlots;i++){
  const v=videos[i],isOn=audible===i;
  v.muted=!isOn;v.defaultMuted=!isOn;
  try{dashSessions[i]?.setMute(!isOn)}catch(e){}
  if(sliders[i]){sliders[i].value=isOn?'100':'0';sliders[i].classList.toggle('on',isOn);sliders[i].setAttribute('aria-valuetext',isOn?'Ήχος ενεργός':'Χωρίς ήχο')}
  if(speakers[i])speakers[i].textContent=isOn?'🔊':'🔇';
 }
}
function selectAudio(i,enable){
 if(focusIndex!==-1)return;
 if(!enable){if(audible===i)audible=-1;paintAudio();return}
 if(!channelFor(i)){paintAudio();return}
 audible=i;
 paintAudio();
 if(!loaded.has(i)){
  loaded.add(i);
  void loadSlot(i,session);
 }else{
  // Direct touch/slider interaction is required for audio on iOS WebKit.
  const attempt=videos[i].play();if(attempt&&typeof attempt.catch==='function')attempt.catch(()=>{feedbacks[i].textContent='🔇';});
 }
}
function cleanup(i){
 const video=videos[i];video.muted=true;video.pause();
 try{dashSessions[i]?.reset()}catch(e){}
 try{hlsSessions[i]?.destroy()}catch(e){}
 dashSessions[i]=null;hlsSessions[i]=null;
 video.removeAttribute('src');video.load();feedbacks[i].textContent='';feedbacks[i].classList.remove('error');
}
function addScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
let dashLoading=null,hlsLoading=null;
function needsDash(){return dashLoading||(dashLoading=addScript('https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js'))}
function needsHls(){return hlsLoading||(hlsLoading=addScript('https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js'))}
async function attachStream(video,c,i,token,isFocus){
 let d=null,h=null;
 const valid=()=>isFocus?(token===focusToken&&focusIndex!==-1):(token===session);
 if(!valid())return;
 if(c.format==='dash'){
  try{
   await needsDash();
   if(!valid())return;
   d=window.dashjs.MediaPlayer().create();d.initialize(video,c.url,false);d.setMute(!isFocus && audible!==i);
  }catch(e){throw new Error('DASH')}
 }else if(video.canPlayType('application/vnd.apple.mpegurl')){
  video.src=c.url;
 }else{
  try{
   await needsHls();
   if(!valid())return;
   if(!Hls.isSupported())throw Error('HLS not supported');
   h=new Hls({startLevel:0,maxBufferLength:7,capLevelToPlayerSize:true});h.loadSource(c.url);h.attachMedia(video);
  }catch(e){throw new Error('HLS')}
 }
 if(!valid()){try{d?.reset();h?.destroy()}catch(e){}return}
 if(isFocus){focusDash=d;focusHls=h}else{dashSessions[i]=d;hlsSessions[i]=h}
 const shouldMute=!isFocus&&audible!==i;
 video.muted=shouldMute;video.defaultMuted=shouldMute;
 try{await video.play()}catch(e){if(!isFocus)throw new Error('PLAY')}
}
async function loadSlot(i,token){
 const c=channelFor(i);if(!c)return;
 cleanup(i);feedbacks[i].textContent='· · ·';feedbacks[i].classList.remove('error');
 try{await attachStream(videos[i],c,i,token,false)}catch(e){if(token===session){feedbacks[i].textContent='⚠';feedbacks[i].classList.add('error')}}
}
async function start(n){
 ++session;const token=session;playingCount=n;audible=-1;loaded.clear();paintAudio();
 for(let i=0;i<totalSlots;i++)cleanup(i);
 let launched=0;
 for(let i=0;i<totalSlots;i++){
  if(session!==token)break;
  if(!channelFor(i)||launched>=n)continue;
  loaded.add(i);launched++;void loadSlot(i,token);
  await new Promise(resolve=>setTimeout(resolve,170));
 }
}
function stop(){++session;playingCount=0;audible=-1;loaded.clear();paintAudio();for(let i=0;i<totalSlots;i++)cleanup(i)}
async function openFocus(i){
 const c=channelFor(i);if(!c)return;
 focusIndex=i;const token=++focusToken;audible=-1;paintAudio();
 for(const v of videos)v.pause();
 focusVideo.pause();focusVideo.removeAttribute('src');focusVideo.load();
 try{focusDash?.reset();focusHls?.destroy()}catch(e){}
 focusDash=null;focusHls=null;
 document.getElementById('focusName').textContent=c.name;
 focus.classList.add('show');focus.setAttribute('aria-hidden','false');
 focusVideo.muted=false;focusVideo.defaultMuted=false;
 try{await attachStream(focusVideo,c,-1,token,true)}catch(e){}
}
function closeFocus(){
 focusIndex=-1;++focusToken;focusVideo.muted=true;focusVideo.pause();
 try{focusDash?.reset();focusHls?.destroy()}catch(e){}
 focusDash=null;focusHls=null;focusVideo.removeAttribute('src');focusVideo.load();
 focus.classList.remove('show');focus.setAttribute('aria-hidden','true');audible=-1;paintAudio();
 for(const i of loaded){videos[i].play().catch(()=>{})}
}
document.getElementById('two').addEventListener('click',()=>start(2));
document.getElementById('six').addEventListener('click',()=>start(6));
document.getElementById('all').addEventListener('click',()=>start(11));
document.getElementById('stop').addEventListener('click',stop);
document.getElementById('back').addEventListener('click',closeFocus);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focusIndex!==-1)closeFocus()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const v of videos)v.pause();if(focusIndex!==-1)focusVideo.pause()}});
</script>
</body>
</html>
